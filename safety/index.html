<title>D-0507 School Safety Audit Checklist</title>
<style>
:root{
  --navy:#1F3864; --blue:#2E75B6; --lblue:#D6E4F7; --grey:#F0F4F8;
  --green:#1A6B1A; --greenbg:#D5EFCC; --red:#C00000; --redbg:#FFD9D9;
  --amber:#9C6500; --amberbg:#FFF2CC; --ink:#1a1a2a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:Arial,"Helvetica Neue",sans-serif; background:var(--grey); color:var(--ink); font-size:15px;}
header.app{background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0 16px; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(10,20,40,.18);}
body.shrunk header.app{padding-top:calc(env(safe-area-inset-top,0px) + 5px);}
body.shrunk header.app h1{font-size:13.5px;}
body.shrunk header.app .sub{display:none;}
body.shrunk header.app .homelnk{top:4px; padding:3px 9px; font-size:11.5px;}
header.app h1{margin:0; font-size:17px; letter-spacing:.2px;}
header.app .sub{font-size:12px; opacity:.85; margin:3px 0 8px;}
.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:0;}
.tab{flex:0 0 auto; padding:10px 14px; border-radius:8px 8px 0 0; background:rgba(255,255,255,.13); color:#fff; font-weight:bold; font-size:13px; border:none; cursor:pointer; min-height:42px;}
.tab.active{background:var(--grey); color:var(--navy);}
.tab .cnt{font-weight:normal; font-size:11px; opacity:.8;}
main{padding:12px; max-width:1080px; margin:0 auto; padding-bottom:80px;}
.card{background:#fff; border:1px solid #d8dfe8; border-radius:10px; margin-bottom:12px; overflow:hidden;}
.card > .hd{background:var(--blue); color:#fff; padding:12px 14px; font-weight:bold; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; min-height:48px;}
.card > .hd .th{display:block; font-weight:normal; font-size:12px; opacity:.9;}
.card > .hd .prog{font-size:12px; font-weight:normal; text-align:right; white-space:nowrap;}
.bar{height:6px; background:#e2e9f2;}
.bar i{display:block; height:100%; background:var(--green); transition:width .3s;}
.bar i.gap{background:var(--red);}
.body{display:none; padding:6px 10px 12px;}
.card.open .body{display:block;}
.sec{margin:16px 0 6px; background:linear-gradient(90deg,var(--navy),#2c4f86); color:#fff; font-weight:bold; padding:10px 14px; border-radius:9px; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; box-shadow:0 2px 6px rgba(31,56,100,.22);}
.sec .sect{display:flex; flex-direction:column; gap:1px;}
.sec .sect i{font-style:normal; font-weight:normal; font-size:11.5px; opacity:.85;}
.secbtns{display:flex; gap:5px; flex-wrap:wrap;}
.bulk.na{border-color:#9aa7b8; color:#5a6675;}
.sec .mini{font-size:11px; font-weight:normal;}
.grp{border:1px solid #dbe3ee; border-left:4px solid var(--blue); border-radius:8px; margin:9px 0 9px 6px; overflow:hidden; background:#fff;}
.grp .ghd{background:var(--lblue); padding:8px 12px; border-bottom:1px solid #dbe6f4; font-size:13px; color:var(--navy); display:flex; gap:8px; align-items:baseline; justify-content:space-between; flex-wrap:wrap;}
.grp .ghd b{font-size:13px;}
.gno{background:var(--navy); color:#fff; border-radius:5px; padding:1px 7px; font-size:12px; flex:0 0 auto;}
.bulk{border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:6px; font-size:11px; padding:4px 8px; cursor:pointer;}
.item{padding:10px 12px; border-top:1px solid #eef2f7; display:block;}
.item.hdRow{background:#fbfcff;}
.item .d{margin:0 0 6px; line-height:1.45;}
.item.hdRow .d{font-weight:bold; color:var(--navy);}
.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px;}
.chip{font-size:11px; border-radius:5px; padding:2px 7px; background:var(--grey); color:#4a5a70; border:1px solid #dde4ee;}
.chip.rr{background:#eef4fb; color:var(--blue); border-color:#c9dcf2;}
.chip.prevY{background:var(--greenbg); color:var(--green); border:none;}
.chip.prevN{background:var(--redbg); color:var(--red); border:none;}
.chip.prevNA{background:#eee; color:#666; border:none;}
.ctr{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.stbtn{min-width:52px; min-height:40px; border-radius:8px; border:1.5px solid #c8d2e0; background:#fff; font-weight:bold; font-size:14px; cursor:pointer; color:#5a6a80;}
.stbtn.S.on{background:var(--green); border-color:var(--green); color:#fff;}
.stbtn.U.on{background:var(--red); border-color:var(--red); color:#fff;}
.stbtn.NA.on{background:#667; border-color:#667; color:#fff;}
.refin{flex:1 1 200px; min-height:38px; border:1px solid #c8d2e0; border-radius:7px; padding:6px 9px; font-size:13px; font-family:inherit; color:var(--navy); background:#fff;}
.rmk{width:100%; margin-top:7px; border:1.5px solid #d3dce8; background:#fbfcfe; border-radius:7px; padding:7px 9px; font-size:13px; font-family:inherit; min-height:44px;}
.item.stU .rmk{border-color:var(--red); background:#fff8f8;}
.rmk.fxk{border-left:4px solid #1A6B1A; background:#f7fcf7;}   /* ช่องแนวทางแก้ไข — เขียว แยกจากช่องหลักฐาน */
.item.stU .rmk.fxk{border-color:#1A6B1A; background:#f7fcf7;}  /* ข้อที่เป็น GAP ก็คงสีเขียวไว้ ไม่ทับด้วยแดง */
.thd{margin:0 0 6px; color:#556; font-size:13px; line-height:1.45;}
details.mref{margin:0 0 8px; border:1px solid #c9dcf2; border-radius:7px; background:#f4f8fd; font-size:12.5px;}
details.mref summary{padding:7px 10px; color:var(--blue); font-weight:bold; cursor:pointer; min-height:36px; display:flex; align-items:center; gap:6px; list-style:none;}
details.mref summary::-webkit-details-marker{display:none;}
details.mref[open] summary{border-bottom:1px dashed #c9dcf2;}
details.mref .mx{padding:8px 11px; color:#334; line-height:1.55; white-space:pre-line;}
details.mref .mx b{color:var(--navy);}
details.how2{background:#fffdf4; border-color:#e8d9a8;}
details.how2 summary{color:var(--amber);}
.assignbar{background:#fff; border:2px solid var(--blue); border-radius:10px; padding:12px; margin-bottom:14px;}
.assignbar h4{margin:0 0 8px; color:var(--navy); font-size:14px;}
.assignbar .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.assignbar input{min-height:42px; border:1px solid #c8d2e0; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit;}
.gsel{width:24px; height:24px; accent-color:var(--red); flex:0 0 auto; margin-top:2px;}
.gaphead{display:flex; gap:10px; align-items:flex-start;}
.carbox{background:#f7f9fc; border:1px solid #c9d6e8; border-radius:8px; padding:9px 11px; margin-top:8px; font-size:12.5px;}
.carbox .cno{font-weight:bold; color:var(--navy);}
.carpill{display:inline-block; border-radius:10px; padding:2px 10px; font-size:11px; font-weight:bold; margin-left:6px;}
.carpill.A{background:var(--amberbg); color:var(--amber);}
.carpill.R{background:#dbe9ff; color:#1d5eb8;}
.carpill.V{background:var(--greenbg); color:var(--green);}
.carpill.X{background:var(--redbg); color:var(--red);}
.overdue{color:var(--red); font-weight:bold;}
.carbox .hist{color:#7a8798; font-size:11px; margin-top:5px; white-space:pre-line;}
.castep{display:flex; gap:9px; margin-top:9px;}
.castep .sn{flex:0 0 24px; height:24px; border-radius:50%; background:var(--blue); color:#fff; font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center;}
.castep.done .sn{background:var(--green);}
.castep.wait .sn{background:#aab6c6;}
.castep .sb{flex:1; min-width:0;}
.ca-lb{font-weight:bold; color:var(--navy); font-size:12px; margin-top:7px;}
.ca-sm{min-height:34px; border:1px solid #c8d2e0; border-radius:6px; padding:3px 8px;}
#libbox{background:#eef4fb; margin:0 -16px; border-top:1px solid #3d5f96;}
#libbox .lb-in{max-width:1240px; margin:0 auto; padding:6px 14px; font-size:12.5px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; max-height:96px; overflow-y:auto;}
body.shrunk #libbox .lb-in{padding:4px 14px; max-height:60px;}
#libbox .lb-t{font-weight:bold; color:var(--navy);}
#libbox .lb-add{min-height:32px; border-radius:7px; border:1px dashed var(--blue); background:#fff; color:var(--blue); font-size:11.5px; font-weight:bold; padding:3px 10px; cursor:pointer;}
#libbox .lkchip .x{margin-left:6px; color:var(--red); font-weight:bold; cursor:pointer;}
.item.jump{animation:jumpfx 2.2s ease-out;}
@keyframes jumpfx{0%{background:#FFF3C4; box-shadow:0 0 0 3px #E9B949;}70%{background:#FFFBEB; box-shadow:0 0 0 3px rgba(233,185,73,.5);}100%{background:transparent; box-shadow:none;}}
.gotobtn{background:#fff; border:1px solid var(--blue); color:var(--blue); border-radius:7px; font-size:11.5px; font-weight:bold; padding:4px 10px; min-height:32px; cursor:pointer; margin-top:6px;}
.gaphead b.idlink{color:var(--blue); cursor:pointer; text-decoration:underline dotted;}
.lkrow{margin-top:6px;}
.lkchip{display:inline-block; background:#eef4fb; border:1px solid #c9d6e8; border-radius:8px; padding:4px 10px; font-size:11.5px; margin:0 4px 4px 0; color:var(--blue); text-decoration:none; font-weight:bold;}
.lkin{width:100%; min-height:36px; border:1px dashed #c8d2e0; border-radius:7px; padding:5px 9px; font-size:12px; font-family:inherit;}
.sigwrap{position:fixed; inset:0; background:rgba(10,20,40,.55); display:flex; align-items:center; justify-content:center; z-index:99;}
.sigbox{background:#fff; border-radius:12px; padding:16px; max-width:580px; width:94%; box-shadow:0 10px 40px rgba(0,0,0,.3);}
.sigbox canvas{border:1.5px dashed #8fa3bd; border-radius:8px; touch-action:none; width:100%; height:180px; background:#fff; display:block; margin-top:6px;}
.sigslot{border:1px solid #d8dfe8; border-radius:8px; background:#fff; padding:7px 10px; min-width:170px; font-size:11.5px; text-align:center;}
.sigslot img{height:46px; display:block; margin:2px auto;}
.sigslot .sr{font-weight:bold; color:var(--navy);}
.carbtn{min-height:38px; border-radius:7px; border:1px solid var(--blue); background:#fff; color:var(--blue); font-size:12px; font-weight:bold; padding:5px 10px; cursor:pointer; margin:3px 4px 0 0;}
.carbtn.v{border-color:var(--green); color:var(--green);}
.carbtn.x{border-color:var(--red); color:var(--red);}
.ca-in{width:100%; margin-top:6px; border:1px solid #c8d2e0; border-radius:7px; padding:7px 9px; font-size:13px; font-family:inherit; min-height:40px;}
table.cartab{width:100%; border-collapse:collapse; font-size:12.5px; background:#fff;}
table.cartab th{background:var(--navy); color:#fff; padding:7px; text-align:left; font-size:12px;}
table.cartab td{border:1px solid #dde4ee; padding:6px 8px; vertical-align:top;}
.chklist{border:1px dashed #b9c9de; border-radius:8px; padding:8px 10px 4px; margin-bottom:8px; background:#fcfdff;}
.chklist .cht{font-size:11.5px; font-weight:bold; color:var(--navy); margin-bottom:4px;}
.chk{display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:13px; color:#334; cursor:pointer;}
.chk input{width:20px; height:20px; margin:0; flex:0 0 auto; accent-color:var(--green);}
.chk.ck{color:var(--green);}
.photorow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:7px;}
.pbtn{min-height:40px; border-radius:8px; border:1.5px solid var(--blue); background:#fff; color:var(--blue); font-weight:bold; font-size:13px; padding:6px 12px; cursor:pointer;}
.thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid #c8d2e0;}
.thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
.thumb .del{position:absolute; top:0; right:0; background:rgba(192,0,0,.85); color:#fff; border:none; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer; border-radius:0 0 0 7px;}
#pview{position:fixed; inset:0; background:rgba(10,16,30,.92); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px;}
#pview img{max-width:96%; max-height:82vh; border-radius:8px;}
#pview button{min-height:44px; border-radius:9px; border:none; background:#fff; color:var(--navy); font-weight:bold; padding:8px 20px; font-size:14px;}
.how{background:#f6f9fd; border-left:3px solid var(--blue); border-radius:0 7px 7px 0; padding:7px 10px; font-size:12.5px; color:#3a4a60; line-height:1.5; margin-bottom:8px;}
.chip.mt{background:var(--amberbg); color:var(--amber); border:none;}
.dualrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px;}
.dlab{flex:0 0 92px; font-size:11.5px; font-weight:bold; color:var(--navy); line-height:1.25;}
.dhint{font-size:11px; color:#8a97a8;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
.toolbar input[type=search]{flex:1 1 220px; min-height:44px; border:1px solid #c8d2e0; border-radius:9px; padding:8px 12px; font-size:15px; font-family:inherit;}
.fbtn{min-height:40px; border-radius:8px; border:1.5px solid var(--blue); background:#fff; color:var(--blue); font-weight:bold; padding:6px 12px; font-size:13px; cursor:pointer;}
.fbtn.on{background:var(--blue); color:#fff;}
.abtn{min-height:44px; border-radius:9px; border:none; background:var(--navy); color:#fff; font-weight:bold; padding:8px 16px; font-size:14px; cursor:pointer;}
.abtn.sec2{background:var(--blue);}
.abtn.warn{background:var(--red);}
.dash{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:14px;}
.dcard{background:#fff; border:1px solid #d8dfe8; border-radius:10px; padding:14px;}
.dcard h3{margin:0 0 2px; font-size:15px; color:var(--navy);}
.dcard .th{font-size:12px; color:#667; margin-bottom:8px;}
.dnum{font-size:26px; font-weight:bold; color:var(--navy);}
.dnum small{font-size:13px; color:#667; font-weight:normal;}
.drow{display:flex; gap:10px; margin-top:6px; font-size:12px;}
.drow b.g{color:var(--green);} .drow b.u{color:var(--red);} .drow b.n{color:#666;} .drow b.p{color:var(--amber);}
table.cl{width:100%; border-collapse:collapse; font-size:13px; background:#fff;}
table.cl th{background:var(--navy); color:#fff; padding:8px; text-align:left; font-size:12px;}
table.cl td{border:1px solid #dde4ee; padding:7px 8px; vertical-align:top;}
table.cl tr.subhd td{background:var(--lblue); color:var(--navy); font-weight:bold;}
.pill{display:inline-block; border-radius:10px; padding:1px 9px; font-size:11px; font-weight:bold;}
.pill.ok{background:var(--greenbg); color:var(--green);}
.pill.gap{background:var(--redbg); color:var(--red);}
.pill.pend{background:var(--amberbg); color:var(--amber);}
.pill.none{background:#eee; color:#888;}
.audmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-bottom:12px;}
.audmeta label{font-size:11px; color:var(--navy); font-weight:bold; display:block; margin-bottom:2px;}
.audmeta input{width:100%; min-height:42px; border:1px solid #c8d2e0; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit;}
.note{background:#fff; border-left:4px solid var(--blue); padding:10px 12px; font-size:12.5px; color:#445; border-radius:0 8px 8px 0; margin-bottom:12px; line-height:1.5;}
.gapitem{background:#fff; border:1px solid var(--redbg); border-left:4px solid var(--red); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13.5px;}
.gapitem .w{color:#667; font-size:12px; margin-top:3px;}
footer.app{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--navy); padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 8px); display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--navy); z-index:40; gap:8px;}
footer .fbar{flex:1; margin:0 8px;}
.hide{display:none!important;}
@media print{
 header.app,footer.app,.toolbar,.abtn,.fbtn,.bulk,.stbtn{display:none!important;}
 body{background:#fff;} .body{display:block!important;} main{padding-bottom:0;}
}
body.viewonly main button:not(.tabbtn), body.viewonly main input:not([type=search]), body.viewonly main textarea, body.viewonly main select{pointer-events:none; opacity:.55;}
body.viewonly .toolbar{display:none;}
</style>

3","d":"Are SPIs appropriate to flight training — lagging (hard landing/runway excursion/bird strike/airspace infringement per 1,000 flight hours, unstabilised approaches, go-arounds, solo events) and leading (hazard report rate, % SMS training current, % CAPA closed on time, deferred defects), measurable from available data, covering flying, ground and maintenance?","rr":"AMC1 ORA.GEN.200(a)(1)(ii), (c)(3); AMC1 ORA.GEN.200(a)(1)(iii), (d)(1)","rk":"SAQ-F3","ref":"SMM ข้อ5.3.1–5.3.2; OMM ข้อ4.4","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: รายการ SPI; แหล่งข้อมูลแต่ละ SPI · ผู้ถูกตรวจ / สัมภาษณ์: SM, HT · Phase II · CAAT ref SAQ-F3","th":"SPI เหมาะกับการฝึกบินหรือไม่ — มีทั้ง lagging (เช่น hard landing/runway excursion/bird strike/airspace infringement ต่อ 1,000 ชม.บิน, unstabilised approach, go-around, เหตุการณ์ขณะ solo) และ leading (อัตรารายงาน hazard, % SMS training ทันกำหนด, % CAPA ปิดตรงเวลา, % pre-flight/deferred defect) วัดได้จริงจากข้อมูลที่มี และครอบคลุมฝึกบิน ภาคพื้น และซ่อมบำรุง","chk":["รายการ SPI","แหล่งข้อมูลแต่ละ SPI"]},{"id":"SMS-F4","d":"Does every SPI have alert levels and targets (SMM ข้อ5.3.3 Green/Amber/Red; ALoS ข้อ5.3.4) based on D-0507's historical baseline (e.g. mean + SD) and shown in SM-SPI301?","rr":"GM2 ORA.GEN.200(a)(1)(i); ICAO Doc 9859 2.12, 5.4.5","rk":"SAQ-F4","ref":"SMM ข้อ5.3.3, ข้อ5.3.4; OMM ข้อ4.12 (SM-SPI301)","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: SM-SPI301; ข้อมูล baseline · ผู้ถูกตรวจ / สัมภาษณ์: SM · Phase II · CAAT ref SAQ-F4","th":"ทุก SPI มี alert level และ target หรือไม่ (SMM ข้อ5.3.3 Green/Amber/Red; ALoS ข้อ5.3.4) ตั้งจาก baseline ข้อมูลย้อนหลังของ D-0507 (เช่น ค่าเฉลี่ย + SD) และแสดงใน SM-SPI301","chk":["SM-SPI301","ข้อมูล baseline"]},{"id":"SMS-F5","d":"Are SPIs objective and linked to State SPIs in the Thailand Aviation Safety Action Plan 2024–2026 (OPR: RE, RI, bird strike, LOC-I, CFIT, MAC; GEN-5 operating SMS) and the Thailand Annual Safety Report 2025 — can each D-0507 SPI be mapped to a CAAT SPI?" dition, shared aerodrome use), fuel supplier — with records of two-way communication and follow-up?","rr":"AMC1 ORA.GEN.200(a)(1)(iv); ICAO Doc 9859 5.3.92–5.3.93","rk":"SAQ-F14","ref":"OMM ข้อ4.14.6, ข้อ3.4.10, Part 6 (Information step); SMM ข้อ6.2.4–6.2.5","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: หนังสือ/e-mail ถึง CAAT, AMO, ท่าอากาศยาน; บันทึกการประชุมร่วม · ผู้ถูกตรวจ / สัมภาษณ์: SM, MM, ACM · Phase III · CAAT ref SAQ-F14","th":"D-0507 สื่อสารข้อมูลความปลอดภัยกับหน่วยงานภายนอกอย่างไร (ช่องทางทางการตาม OMM ข้อ4.14.6) — CAAT (occurrence report/follow-up), AMO และเจ้าของเครื่องบิน (defect/AD), สนามบินกบินทร์บุรี (bird/wildlife hazard, สภาพ apron/runway, การใช้สนามร่วม), ผู้จัดหาน้ำมัน; มีบันทึกการสื่อสารสองทางและการติดตามผล","chk":["หนังสือ/e-mail ถึง CAAT, AMO, ท่าอากาศยาน","บันทึกการประชุมร่วม"]}]}]}]},{"t":"SMS-S – D-0507 Supplement","th":"ข้อเพิ่มเติมเฉพาะ D-0507 (ปิดช่องว่างจาก CAAT Findings 2024)","secs":[{"t":"","groups":[{"n":"1","subj":"1. Document control & consistency","items":[{"id":"SMS-D0507-S1","d":"Are OMM Issue 01, SMM Issue 02 (21 AUG 2025) and the current OMA approved, effective-dated and consistent in SMS content (OMM still shows DATE: XX XXX XX)? Check safety policy, SRB/SAG membership and frequency, risk matrix, reporting timelines, ERP, fleet list (OMA Part B vs OMM ข้อ1.4) and that the List of Effective Forms covers every SMS form.","rr":"ORA.GEN.200(a)(5); ORA.GEN.130; ORA.ATO.105","rk":"D0507-S1","ref":"OMM Part 0, ข้อ1.4, ข้อ2; SMM ข้อ0.4–0.9; OMA Part A/B; Finding Log GAP-FLEET-001","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: หน้า approval/LEP/Record of Revision ทั้ง 3 คู่มือ; ตารางเปรียบเทียบ · ผู้ถูกตรวจ / สัมภาษณ์: CMM, HT · หมายเหตุบริบท D-0507: เชื่อมกับ SITE-0010 (revision process) และ SITE-0048 (cross-check OMA↔OMM↔Training Spec); OMM ข้อ4.9/ข้อ4.13.1 ยังอ้าง Roi-et airport — ตรวจว่าทุกคู่มือ (OMM/OMA/SMM/ERP/TM) ระบุสถานที่ฝึกตรงกับที่ CAAT อนุมัติ | 2024 F3/F4/F14/F26/F27/F28/F33: แก้คู่มือโดยไม่ใช้ revision form, amendment record ไม่ครบ, checklist นักบิน/ช่างและฟอร์มไม่อยู่ใน doc control, controlled copy หน้าหาย, ที่อยู่ main base ใน SMM ไม่ update — ตรวจซ้ำทุกประเด็น + SMM Issue 02 ข้อ1.8 SMS Document Review Procedure · Phase I · CAAT ref D0507-S1","th":"OMM Issue 01, SMM Issue 02 (21 AUG 2025) และ OMA ฉบับปัจจุบัน ได้รับอนุมัติ มีวันมีผล และเนื้อหา SMS สอดคล้องกันหรือไม่ (OMM ยังแสดง DATE: XX XXX XX) — ตรวจ Safety Policy, ผัง/สมาชิก SRB-SAG, ความถี่ประชุม, Risk Matrix, reporting timeline, ERP, รายชื่อฝูงบิน (OMA Part B vs OMM ข้อ1.4) และ List of Effective Forms ครบทุกฟอร์ม SMS","chk":["หน้า approval/LEP/Record of Revision ทั้ง 3 คู่มือ","ตารางเปรียบเทียบ"]}]},{"n":"2","subj":"2. Applicability / scope of SMS requirements","items":[{"id":"SMS-D0507-S2","d":"Has D-0507 assessed and recorded whether it is a 'non-complex' ATO (AMC1 ORA.GEN.200(b)) and whether ORA.GEN.200(c) applies (PPL and associated ratings only), thereby selecting AMC1 vs AMC2 ORA.GEN.200(b), and do current courses/fleet (incl. MEP/DA42) still fit that scope?","rr":"ORA.GEN.200(b),(c); AMC1/AMC2 ORA.GEN.200(b)","rk":"D0507-S2","ref":"TCAR PEL Part-ORA No.77 ORA.GEN.200(b),(c); OMM ข้อ1.2 (scope), ข้อ4.3; ATO certificate/Training Specification","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: ATO certificate + Training Spec; บันทึกการประเมิน complexity; รายชื่อหลักสูตรที่ได้รับอนุมัติ · ผู้ถูกตรวจ / สัมภาษณ์: CMM, HT, ACM · หมายเหตุบริบท D-0507: ผลประเมินนี้กำหนดว่าข้อ 'Complex ATO' ข้อใดเป็น N/A | 2024 F4 (SEC2-03): หลักสูตร IR/CPL ที่ไม่ได้อนุมัติยังอยู่ในคู่มือ — ตรวจให้หลักสูตรในคู่มือทุกเล่มตรงกับ Training Specification ที่ CAAT อนุมัติ · Phase I · CAAT ref D0507-S2","th":"D-0507 ประเมินและบันทึกหรือไม่ว่าเป็น ATO 'non-complex' (AMC1 ORA.GEN.200(b)) และเข้าข่าย ORA.GEN.200(c) (ฝึกเฉพาะ PPL และ rating ที่เกี่ยวข้อง) เพื่อเลือกใช้ AMC1 หรือ AMC2 ORA.GEN.200(b) และหลักสูตร/ฝูงบินปัจจุบัน (รวม MEP/DA42) ยังอยู่ในขอบเขตนั้น","chk":["ATO certificate + Training Spec","บันทึกการประเมิน complexity","รายชื่อหลักสูตรที่ได้รับอนุมัติ"]}]},{"n":"3","subj":"3. Compliance monitoring – finding classification","items":[{"id":"SMS-D0507-S3","d":"Is the internal finding classification (OMM Part 5: NC-Major / NC-Minor / OBS with CAPA timeframes) aligned with Level 1 / Level 2 / Observation under ORA.GEN.150, clearly defined and consistently applied, with every CAPA showing root cause, corrective and preventive action closed on time?","rr":"ORA.GEN.150; ORA.GEN.200(a)(6)","rk":"D0507-S3","ref":"ORA.GEN.150; OMM Part 5 (Classification of findings, CAPA Time Frame); SMM ข้อ4.9–4.10","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: CAPA Log; ตัวอย่าง finding แต่ละระดับ; นิยามใน OMM · ผู้ถูกตรวจ / สัมภาษณ์: CMM · Phase I · CAAT ref D0507-S3","th":"ระบบจัดระดับข้อบกพร่องภายใน (OMM Part 5: NC-Major / NC-Minor / OBS พร้อมกรอบเวลา CAPA) สอดคล้องกับ Level 1 / Level 2 / Observation ตาม ORA.GEN.150 นิยามชัดใน OMM และผู้ตรวจใช้สม่ำเสมอหรือไม่; CAPA ทุกรายการมี root cause, corrective, preventive และปิดตามกรอบเวลา","chk":["CAPA Log","ตัวอย่าง finding แต่ละระดับ","นิยามใน OMM"]}]},{"n":"4","subj":"4. Safety reporting system – accessibility","items":[{"id":"SMS-D0507-S4","d":"Is the safety reporting system (jotform per OMM Part 6, paper ATT6A, VSR/Hazard forms in the PPL manual) accessible and working (test the link on the audit day), supporting anonymous/confidential reporting (OMM ข้อ4.7), with 12-month usage statistics from students and FIs — if the report rate is unusually low relative to flight hours, explore barriers.","rr":"ORA.GEN.200(a)(3); AMC1 ORA.GEN.200(a)(3)","rk":"D0507-S4","ref":"OMM Part 6 ข้อ6.2.3–6.2.4, ข้อ4.7; SMM ข้อ4.3.1, ข้อ4.3.7; PPL Course Manual ข้อ7.5.16","prev":"","hd":0,"how":"หลักฐานที่ต้องสุ่มตรวจ: ทดสอบ jotform; Occurrence/Hazard Register; สัมภาษณ์นักเรียน/FI · ผู้ถูกตรวจ / สัมภาษณ์: SM, นักเรียน, FI · Phase II · CAAT ref D0507-S4","th":"ระบบรายงานความปลอดภัย (jotform ตาม OMM Part 6, ฟอร์มกระดาษ ATT6A, VSR/Hazard form ใน PPL manual) เข้าถึงง่าย ใช้ได้จริง (ทดสอบลิงก์วันตรวจ const DATA = JSON.parse(document.getElementById('DATA').textContent);

const state = {};   // id -> {st:'S'|'U'|'NA', rm:'', fx:'', ref:''}

const pending=new Set(); let pendingMeta=false, fbReady=false, fbUser=null;
function mark(id){ dirty=true; if(fbReady) pending.add(id); }
function markMeta(){ dirty=true; pendingMeta=true; }

function st(id){ return state[id] || null; }
function setSt(id, v, dim){
  dim = dim || 'st';
  const cur = state[id] || (state[id]={});
  cur[dim] = (cur[dim]===v) ? '' : v;
  mark(id);
  refreshItem(id); refreshCounts();
}
// per-item rolled-up status: dual items combine Doc(st) + Impl(st2)
function rollup(it){
  const s=st(it.id);
  if(!it.dual){ return (s&&s.st)?s.st:''; }
  const a=s&&s.st||'', b=s&&s.st2||'';
  if(a==='U'||b==='U') return 'U';      // any U = GAP, even if other dimension pending
  if(!a||!b) return '';                 // not fully checked
  if(a==='NA'&&b==='NA') return 'NA';
  return 'S';
}

function setFx(id,v){ (state[id]||(state[id]={})).fx=v; mark(id); }
let LIB=[], LIBEDIT=false;

  el.innerHTML=`<div class="lb-in"><span class="lb-t">📎 เอกสารอ้างอิง:</span>
    ${LIB.map((l,i)=>`<span class="lkchip"><a href="${escAttr(l.u)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">🔗 ${esc(l.t||l.u)}</a>${(VIEW_ONLY||!LIBEDIT)?'':`<span class="x" onclick="delLib(${i})" title="ลบเอกสารนี้">✕</span>`}</span>`).join('')}
    ${LIB.length?'':'<span style="color:#7a8798">ยังไม่มี — เพิ่มลิงก์คู่มือ/เอกสารให้ทีมกดเปิดได้จากทุกหน้า</span>'}
    ${VIEW_ONLY?'':`<button class="lb-add" onclick="addLib()">＋ เพิ่มเอกสาร</button>

}
function addLib(){
  const t=prompt('ชื่อเอกสาร (ที่จะแสดง):'); if(t===null||!t.trim()) return;
  const u=prompt('วางลิงก์ URL ของเอกสาร:'); if(u===null||!u.trim()) return;
  if(!/^https?:\/\//i.test(u.trim())){ alert('ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://'); return; }
  LIB.push({t:t.trim(),u:u.trim(),by:fbUser?fbUser.email:''}); saveLib();
}
function delLib(i){
  const l=LIB[i]; if(!l) return;
  if(!confirm('ยืนยันลบเอกสารนี้ออกจากคลัง (ทุกคนในทีมจะไม่เห็นลิงก์นี้อีก)\n\n📄 '+(l.t||l.u))) return;
  LIB.splice(i,1); LIBEDIT=false; saveLib();
}
function saveLib(){
  renderLib();
  if(fbReady&&fbUser) FB.db.collection('library').doc(PROJ).set({links:LIB,u:fbUser.email||''}).catch(e=>{alert('บันทึกคลังเอกสารไม่สำเร็จ: '+e.message);});
}
function watchLib(){
  FB.db.collection('library').doc(PROJ).onSnapshot(d=>{ LIB=(d.exists&&d.data().links)||[]; renderLib(); },e=>console.error(e));
}
function setLk(id,v){ (state[id]||(state[id]={})).lk=v.trim(); mark(id); refreshItem(id); }
function linkRowHTML(it){

// ---------- photo evidence ----------
function addPhoto(id, inp){
  const files=[...inp.files]; inp.value='';
  files.forEach(f=>{
    const img=new Image();
    const rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{
        const MAX=1280;
        const sc=Math.min(1, MAX/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        const data=cv.toDataURL('image/jpeg',0.72);
        const s=(state[id]=state[id]||{}); s.ph=s.ph||[];
        s.ph.push({d:data, t:new Date().toISOString().slice(0,16).replace('T',' ')});
        mark(id); if(fbReady) uploadPhoto(id, s.ph.length-1);
        refreshItem(id); refreshCounts();
      }; img.src=rd.result; };
    rd.readAsDataURL(f);
  });
}
function delPhoto(id,i){
  const s=st(id); if(!s||!s.ph) return;
  s.ph.splice(i,1); mark(id); refreshItem(id);

function viewPhoto(id,i){
  const s=st(id); if(!s||!s.ph||!s.ph[i]) return;
  const ov=document.createElement('div'); ov.id='pview';
  ov.innerHTML=`<img src="${s.ph[i].d||s.ph[i].u}"><div style="color:#cdd8ea;font-size:12px">${id} · ${s.ph[i].t||''}</div><button onclick="document.getElementById('pview').remove()">ปิด</button>`;
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

// ---------- counts ----------
function countOf(items){
  let c={S:0,U:0,NA:0,done:0,tot:items.length};
  items.forEach(it=>{const r=rollup(it); if(r){c[r]++; c.done++;}});
  return c;
}
function modItems(mc){ return ALL.filter(it=>it._m===mc); }
function refreshCounts(){
  const c=countOf(ALL);
  document.getElementById('ftxt').textContent = `ตรวจแล้ว ${c.done} / ${c.tot}`;
  document.getElementById('fbar').style.width = (100*c.done/c.tot)+'%';
  document.getElementById('fgap').textContent = 'GAP: '+c.U;
  document.querySelectorAll('[data-partcnt]').forEach(el=>{
    const [mc,pi]=el.dataset.partcnt.split('|');
    const items=ALL.filter(it=>it._m===mc&&it._pi==pi);
    const c=countOf(items);
    el.textContent=`${c.done}/${c.tot}` + (c.U?` · GAP ${c.U}`:'');
    const bar=document.querySelector(`[data-partbar="${el.dataset.partcnt}"]`);
    if(bar){bar.querySelector('i:not(.gap)').style.width=(100*c.S/c.tot)+'%';
            bar.querySelector('i.gap').style.width=(100*c.U/c.tot)+'%';}
  });
  document.querySelectorAll('[data-tabcnt]').forEach(el=>{
    const c=countOf(modItems(el.dataset.tabcnt));
    el.textContent=`${c.done}/${c.tot}`;
  });
}

function refreshItem(id){

    const s=st(id)||{};

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderTabs(){

function go(k){ curTab=k; render(); window.scrollTo(0,0); }

function matches(it){
  if(filter.st){
    const r=rollup(it);
    if(filter.st==='pend' && r) return false;
    if(filter.st!=='pend' && r!==filter.st) return false;
  }
  if(filter.q){
    const q=filter.q.toLowerCase();
    if(!(it.d.toLowerCase().includes(q) || (it.th||'').toLowerCase().includes(q) ||
         (it.how||'').toLowerCase().includes(q) || (it.rr||'').toLowerCase().includes(q) ||
         (it._g.subj||'').toLowerCase().includes(q) || effRef(it).toLowerCase().includes(q))) return false;
  }
  return true;
}

function renderModule(mc){

    · <b>S</b>=Satisfactory (มี/สอดคล้อง) · <b>U</b>=Unsatisfactory (GAP – ต้องแก้ไข) · <b>N/A</b>=ไม่เกี่ยวข้อง`

  });

const openParts=new Set();
function gotoItem(id){
  const it=ALL.find(x=>x.id===id); if(!it) return;
  filter.q=''; filter.st='';                 // ล้างตัวกรองที่อาจซ่อนข้อนี้
  curTab=it._m;
  openParts.add(`${it._m}|${it._pi}`);       // เปิด Part ที่ข้อนั้นอยู่
  render();
  setTimeout(()=>{
    const el=document.getElementById('it_'+id);
    if(!el){ return; }
    const hdr=document.querySelector('header.app');
    const off=(hdr?hdr.getBoundingClientRect().height:0)+12;
    window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off, behavior:'smooth'});
    el.classList.add('jump'); setTimeout(()=>el.classList.remove('jump'),2400);
  },120);
}
function togglePart(key){
  const [mc,pi]=key.split('|');
  if(openParts.has(key)) openParts.delete(key); else openParts.add(key);
  const card=document.getElementById(`part_${mc}_${pi}`);
  if(!card) return;
  card.classList.toggle('open');
  const body=card.querySelector('.body');
  if(card.classList.contains('open') && !body.dataset.done){
    const m=MODS.find(x=>x.c===mc);
    body.innerHTML=partBody(m,m.parts[pi],+pi);
    body.dataset.done=1;
  }
  refreshCounts();
}
function partBody(m,p,pi){
  let h='';
  p.secs.forEach((s,si)=>{
    const secItems=[]; s.groups.forEach(g=>g.items.forEach(it=>{if(matches(it))secItems.push(it);}));
    if(!secItems.length && (filter.q||filter.st)) return;
    if(s.t){
      const sd=secItems.filter(it=>rollup(it)).length, sg=secItems.filter(it=>{const x=st(it.id)||{};return x.st==='U'||(it.dual&&x.st2==='U');}).length;
      h+=`<div class="sec"><span class="sect">${esc(s.t)}<i>${sd}/${secItems.length}${sg?` · GAP ${sg}`:''}</i></span>
       <span class="secbtns"><button class="bulk" onclick="bulkSec('${m.c}',${pi},${si},'S')">S ✓ ทั้งหมด</button>
       <button class="bulk na" onclick="bulkSec('${m.c}',${pi},${si},'NA')">N/A ทั้งหมด</button></span></div>`;
    }
    s.groups.forEach((g,gi)=>{
      const its=g.items.filter(matches);
      if(!its.length) return;
      h+=`<div class="grp"><div class="ghd">
        <span>${g.n?`<span class="gno">${esc(g.n)}</span>`:''} <b>${esc(g.subj)}</b></span>
        <span class="secbtns"><button class="bulk" onclick="bulkGrp('${m.c}',${pi},${si},${gi},'S')">S ✓ ทั้งกลุ่ม</button>
        <button class="bulk na" onclick="bulkGrp('${m.c}',${pi},${si},${gi},'NA')">N/A ทั้งกลุ่ม</button></span>
      </div>
      ${g.how?`<details class="mref how2" style="margin:6px 8px"><summary>🔎 วิธีตรวจกลุ่มนี้ / How to verify</summary><div class="mx">${esc(g.how)}</div></details>`:''}`;
      its.forEach(it=>h+=itemHTML(it));
      h+=`</div>`;
    });
  });
  return h || '<p style="color:#889;padding:8px">— ไม่มีรายการตรงเงื่อนไข —</p>';
}
function bulkOne(it,val){
  const v=val||'S';
  const s=(state[it.id]=state[it.id]||{});
  if(!s.st) s.st=v;
  if(it.dual && !s.st2) s.st2=v;
  mark(it.id);
}
function bulkGrp(mc,pi,si,gi,val){
  const its=MODS.find(x=>x.c===mc).parts[pi].secs[si].groups[gi].items;
  if(val==='NA'&&!confirm('ตั้ง N/A ให้ทุกข้อที่ยังไม่ได้ตรวจในกลุ่มนี้ ('+its.length+' ข้อ)?')) return;
  its.forEach(it=>bulkOne(it,val));
  dirty=true; rerenderOpen(mc,pi); refreshCounts();
}
function bulkSec(mc,pi,si,val){
  const sec=MODS.find(x=>x.c===mc).parts[pi].secs[si];
  const n=sec.groups.reduce((a,g)=>a+g.items.length,0);
  if(val==='NA'&&!confirm('ตั้ง N/A ให้ทุกข้อที่ยังไม่ได้ตรวจในหมวดนี้ ('+n+' ข้อ)?')) return;
  sec.groups.forEach(g=>g.items.forEach(it=>bulkOne(it,val)));
  dirty=true; rerenderOpen(mc,pi); refreshCounts();
}
function rerenderOpen(mc,pi){
  const card=document.getElementById(`part_${mc}_${pi}`);
  if(card&&card.classList.contains('open')){
    const m=MODS.find(x=>x.c===mc);
    card.querySelector('.body').innerHTML=partBody(m,m.parts[pi],pi);
  }
}

  h+=`<div class="note"><b>Coverage by TCAR-ORA / Part FCL clause</b> — ความครอบคลุมรายข้อกำหนด: จำนวนรายการตรวจที่ผูกกับแต่ละ clause และสถานะ

  h+='<table class="cl"><tr><th style="width:120px">Clause</th><th>Requirement</th><th style="width:90px">รายการ</th><th style="width:150px">สถานะ</th></tr>';
  CATALOG.forEach(([sub,subth,rows])=>{
    h+=`<tr class="subhd"><td colspan="4">${esc(sub)} — ${esc(subth)}</td></tr>`;

        <td>${its.length?c.done+'/'+its.length:'—'}</td><td>${pill}</td></tr>`;
    });
  });
  h+='</table>';
  return h;
}

const gapSel=new Set();

function mailBody(ids, name, due){

let SIGCTX=null, SIGQ=null;
const SIG_ROLES={resp:'Responsible Person / ผู้รับผิดชอบ', aud:'Auditor / ผู้ตรวจ', cmm:'Compliance Monitoring Manager'};
function openSig(idOrIds, role, cb){
  const ids=Array.isArray(idOrIds)?idOrIds:[idOrIds];
  const c=carOf(ids[0]); if(!c) return;
  SIGQ={ids, role, cb:cb||null};
  const names={resp:c.as||'', aud:uName()||meta.auditor||'', cmm:''};
  const prev=(c.sg&&c.sg[role])||null;
  const w=document.createElement('div'); w.className='sigwrap'; w.id='sigwrap';
  w.innerHTML=`<div class="sigbox">
    <b style="color:var(--navy)">✍ ลงชื่อ — ${SIG_ROLES[role]}</b>${ids.length>1?`<span class="carpill A" style="margin-left:8px">ใช้กับ ${ids.length} CAR ที่เลือก</span>`:''}
    <div style="margin:8px 0">ชื่อ-นามสกุล: <input id="sig_n" class="ca-sm" style="width:62%" value="${esc((prev&&prev.n)||names[role]||'')}" placeholder="ชื่อผู้ลงนาม"></div>
    <canvas id="sig_c" width="540" height="180"></canvas>
    <div style="color:#7a8798;font-size:11px;margin-top:3px">เซ็นในกรอบด้วยนิ้ว / Apple Pencil / เมาส์</div>
    <div style="margin-top:10px;text-align:right">
      <button class="carbtn" onclick="sigClear()">ล้าง</button>
      <button class="carbtn" onclick="document.getElementById('sigwrap').remove()">ยกเลิก</button>
      <button class="carbtn v" onclick="sigSave()">✔ บันทึกลายเซ็น</button>
    </div></div>`;
  document.body.appendChild(w);
  const cv=document.getElementById('sig_c'); const ctx=cv.getContext('2d');
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#16305e';
  let drawing=false, drew=false;
  const pos=e=>{const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{drawing=true; drew=true; cv.setPointerCapture(e.pointerId); const p=pos(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]+.1,p[1]+.1); ctx.stroke(); e.preventDefault();};
  cv.onpointermove=e=>{if(!drawing)return; const p=pos(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); e.preventDefault();};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
  SIGCTX={cv,ctx,hasInk:()=>drew,resetInk:()=>{drew=false;}};
}
function sigClear(){ if(SIGCTX){ SIGCTX.ctx.clearRect(0,0,SIGCTX.cv.width,SIGCTX.cv.height); SIGCTX.resetInk(); } }
function sigSave(){
  if(!SIGQ) return;
  const n=(document.getElementById('sig_n').value||'').trim();
  if(!n){ alert('กรอกชื่อผู้ลงนาม'); return; }
  if(!SIGCTX||!SIGCTX.hasInk()){ alert('ยังไม่ได้เซ็นในกรอบ'); return; }
  const png=SIGCTX.cv.toDataURL('image/png');
  const {ids, role, cb}=SIGQ;
  ids.forEach(id=>{
    const s=(state[id]=state[id]||{}); const c=(s.car=s.car||{});
    c.sg=c.sg||{}; c.sg[role]={d:png, n:n, dt:today()};
    logCar(c,`ลงชื่อ${role==='resp'?'ผู้รับผิดชอบ':role==='aud'?'ผู้ตรวจ':' CMM'}: ${n}`);
    mark(id);
  });
  const w=document.getElementById('sigwrap'); if(w) w.remove();
  SIGQ=null;
  if(cb) cb(); else render();
}

function bulkAcceptGo(idstr){
  const ids=idstr.split(',');
  const ev=(document.getElementById('ba_ev').value||'').trim();
  const vd=(document.getElementById('ba_date').value||'').trim()||today();
  document.getElementById('bawrap').remove();
  openSig(ids,'aud',()=>{
    ids.forEach(id=>{ const c=carOf(id);
      if(!(c.vev||'').trim()) c.vev=ev;
      if(c.cast!=='R'&&!c.cadate) c.cadate=c.cadone||vd;
      c.cast='V'; c.vdate=vd; c.vby=(c.sg&&c.sg.aud&&c.sg.aud.n)||uName()||'';
      if(c.sg&&c.sg.aud) c.sg.aud.dt=vd;
      logCar(c,'Accepted (ตรวจรับรวม) — ปิด CAR วันที่ '+vd+' โดย '+(c.vby||'ผู้ตรวจ')); mark(id); });
    carSel.clear(); render(); syncStatus('✔ ตรวจรับผ่าน — ปิดแล้ว '+ids.length+' CAR ('+vd+')','var(--green)');

function carReassignGo(id){

function gapType(it){
  const s=st(it.id)||{};
  if(!it.dual) return s.st==='U' ? 'Doc GAP – ไม่มี/ไม่ครบในคู่มือ' : '';
  const d=s.st==='U', i=s.st2==='U';
  if(d&&i) return 'Doc + Implementation GAP – ไม่มีในคู่มือและไม่ได้ปฏิบัติ';
  if(d) return 'Doc GAP – ไม่มี/ไม่ครบในคู่มือ';
  if(i) return 'Implementation GAP – เขียนไว้แต่ไม่ได้ปฏิบัติ/หลักฐานไม่พอ';
  return '';
}

function dl(name, text, type){

  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

      if(fbReady){ Object.keys(state).forEach(k=>pending.add(k)); pendingMeta=true; }
      dirty=false; render();
      alert('โหลดความคืบหน้าเรียบร้อย ('+Object.keys(d.state||{}).length+' รายการ)');
    }catch(e){ alert('ไฟล์ไม่ถูกต้อง: '+e.message); } };
  r.readAsText(f);
  inp.value='';
}

// ---------- main render ----------
function render(){
  renderTabs();
  const el=document.getElementById('main');
  if(curTab==='dash') el.innerHTML=renderDash();
  else if(curTab==='gap') el.innerHTML=renderGap();
  else if(curTab==='car') el.innerHTML=renderCar();
  else el.innerHTML=renderModule(curTab);
  refreshCounts();
}
window.addEventListener('beforeunload',e=>{ if(dirty && !fbReady){e.preventDefault(); e.returnValue='';} });
render();

// ═══════════════════ FIREBASE SERVER SYNC ═══════════════════
let FB={};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function syncStatus(txt,color){ const el=document.getElementById('syncst'); if(el){ el.textContent=txt; el.style.color=color||'var(--navy)'; } }
async function initFirebase(){
  if(!FIREBASE_CONFIG) return;
  const f=document.querySelector('footer.app');
  f.insertAdjacentHTML('beforeend','<span id="syncst" style="font-size:11px">…</span><button id="fbout" class="carbtn hide" onclick="firebase.auth().signOut()">ออก</button>');
  syncStatus('⏳ กำลังเชื่อมต่อ…');
  try{
    const V='10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await Promise.all([
      loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`),
      loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`),
      loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-storage-compat.js`),
    ]);
    firebase.initializeApp(FIREBASE_CONFIG);
    FB.db=firebase.firestore(); FB.st=firebase.storage();
    firebase.auth().onAuthStateChanged(u=>{
      fbUser=u;
      document.getElementById('loginov')?.remove();
      document.getElementById('fbout')?.classList.toggle('hide',!u);
      if(u){ startSync(); }
      else if(VIEW_ONLY){ fbReady=false; syncStatus('👁 โหมดเปิดดูรายการตรวจ — ไม่บันทึกข้อมูล','var(--blue)');
        alertBar('👁 <b>ตอนนี้เป็นโหมดเปิดดูอย่างเดียว</b> — พิมพ์หรือติ๊กอะไรไม่ได้ และระบบไม่บันทึก (ลิงก์มี <code>?view=1</code>) '
          +'<button onclick="goEdit()" style="margin-left:8px;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:bold;cursor:pointer">✏ เข้าโหมดกรอกข้อมูล</button>','#FFF4CE'); }
      else { fbReady=false; syncStatus('○ ยังไม่ได้เข้าสู่ระบบ','#C00000'); showLogin();
        alertBar('🔒 <b>ยังไม่ได้เข้าสู่ระบบ</b> — ต้องเข้าสู่ระบบก่อนจึงจะกรอกและบันทึกได้ ถ้าไม่เห็นกล่องเข้าสู่ระบบ ให้รีเฟรชหน้านี้','#FFF4CE'); }
    });
  }catch(e){ syncStatus('⚠ เชื่อมต่อไม่ได้ — โหมดออฟไลน์','#C00000'); console.error(e); }
}
function showLogin(){
  if(document.getElementById('loginov')) return;
  const ov=document.createElement('div');
  ov.id='loginov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(15,25,45,.94);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:400px;width:100%;padding:24px">
    <h2 style="color:var(--navy);margin:0 0 4px;font-size:18px">D-0507 Internal Audit</h2>
    <p style="color:#667;font-size:13px;margin:0 0 16px">เข้าสู่ระบบเพื่อใช้งานร่วมกับทีม (ข้อมูล sync อัตโนมัติ)</p>
    <button class="abtn" style="width:100%;margin-bottom:14px" onclick="fbGoogle()">🔵 เข้าสู่ระบบด้วย Google</button>
    <div style="border-top:1px solid #e2e8f0;margin:10px 0;text-align:center;color:#99a;font-size:11px;line-height:0"><span style="background:#fff;padding:0 8px">หรือ</span></div>
    <input id="li_em" type="email" placeholder="อีเมล" style="width:100%;min-height:44px;border:1px solid #c8d2e0;border-radius:8px;padding:8px 12px;margin:8px 0;box-sizing:border-box">
    <input id="li_pw" type="password" placeholder="รหัสผ่าน" style="width:100%;min-height:44px;border:1px solid #c8d2e0;border-radius:8px;padding:8px 12px;margin:0 0 12px;box-sizing:border-box">
    <div style="display:flex;gap:8px">
      <button class="abtn sec2" style="flex:1" onclick="fbEmail(false)">เข้าสู่ระบบ</button>
      <button class="fbtn" style="flex:1" onclick="fbEmail(true)">สมัครใหม่</button>
    </div>
    <p id="li_err" style="color:var(--red);font-size:12px;min-height:16px;margin:8px 0 0"></p>
  </div>`;
  document.body.appendChild(ov);
}
function fbErr(e){ const el=document.getElementById('li_err'); if(el) el.textContent=e.message||e; }
function fbGoogle(){ firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(fbErr); }
function fbEmail(create){
  const em=document.getElementById('li_em').value.trim(), pw=document.getElementById('li_pw').value;
  (create?firebase.auth().createUserWithEmailAndPassword(em,pw):firebase.auth().signInWithEmailAndPassword(em,pw)).catch(fbErr);
}
function itemsCol(){ return FB.db.collection('audits').doc(AUDIT_ID).collection('items'); }
function cleanForWrite(s){
  const o=JSON.parse(JSON.stringify(s||{}));
  if(o.ph) o.ph=o.ph.filter(p=>p.u).map(p=>({u:p.u,t:p.t||''}));   // only Storage-uploaded photos sync
  return o;
}
function startSync(){
  fbReady=true;
  syncStatus('☁ '+(fbUser.email||'signed in'),'var(--green)');
  { const el=document.getElementById('alertbar'); if(el) el.style.display='none'; }
  // meta
  FB.db.collection('audits').doc(AUDIT_ID).onSnapshot(d=>{
    if(pendingMeta||!d.exists) return;
    const m=d.data().meta; if(m){ Object.assign(meta,m); if(curTab==='dash') render(); }
  });
  // items realtime
  FB.unsub && FB.unsub();
  FB.unsub=itemsCol().onSnapshot(snap=>{
    let changed=0;
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(pending.has(id)) return;               // local edit wins until flushed
      const {t,u,...rest}=ch.doc.data();
      const loc=state[id];
      // keep local-only dataURL photos
      if(loc&&loc.ph){ const localOnly=loc.ph.filter(p=>p.d&&!p.u); rest.ph=[...(rest.ph||[]),...localOnly]; }
      state[id]=rest; changed++;
      refreshItem(id);
    });
    if(changed){ refreshCounts(); if(['gap','car','dash'].includes(curTab)) render(); }
  },e=>{ console.error(e);
    if(e&&e.code==='permission-denied'){ syncStatus('⛔ ไม่มีสิทธิ์อ่านรอบตรวจนี้','#C00000');
      alertBar('⛔ <b>บัญชีนี้ไม่มีสิทธิ์เข้าถึงข้อมูลรอบตรวจ '+AUDIT_ID+'</b> — แจ้งผู้ดูแลให้เพิ่มอีเมล <b>'+((fbUser&&fbUser.email)||'-')+'</b> ใน Firestore Security Rules','#FDECEC');
    } else syncStatus('⚠ sync error','#C00000'); });
  // flusher
  FB.timer && clearInterval(FB.timer);
  FB.timer=setInterval(flush, 2500);
  setTimeout(pushSummary, 6000);   // อัปเดตสรุปให้ Portal หลังโหลดข้อมูลรอบแรก
  watchLib();
}
function pushSummary(){
  if(!fbReady||!fbUser) return;
  try{
    const gaps=ALL.filter(it=>{const s=st(it.id)||{};return s.st==='U'||(it.dual&&s.st2==='U');}).length;
    const done=ALL.filter(it=>rollup(it)).length;
    const cars=ALL.filter(it=>carOf(it.id)&&carOf(it.id).no);
    const open=cars.filter(it=>carOf(it.id).cast!=='V').length;
    FB.db.collection('audits').doc(AUDIT_ID).set({sum:{done:done,gap:gaps,total:ALL.length,car:cars.length,carOpen:open,at:new Date().toISOString()}},{merge:true}).catch(console.error);
  }catch(e){ console.error(e); }
}
async function flush(){
  if(!fbReady||!fbUser) return;
  if(pendingMeta){
    pendingMeta=false;
    FB.db.collection('audits').doc(AUDIT_ID).set({meta:{auditor:meta.auditor,date:meta.date,scope:meta.scope,auditee:meta.auditee||'',concl:meta.concl||'',reco:meta.reco||''},
      t:firebase.firestore.FieldValue.serverTimestamp(), u:fbUser.email||''},{merge:true}).catch(console.error);
  }
  if(!pending.size) return;
  const ids=[...pending]; pending.clear();
  const batch=FB.db.batch();
  ids.forEach(id=>{
    batch.set(itemsCol().doc(id), {...cleanForWrite(state[id]),
      t:firebase.firestore.FieldValue.serverTimestamp(), u:fbUser.email||''}, {merge:false});
  });
  try{ await batch.commit(); syncStatus('☁ บันทึกแล้ว '+new Date().toTimeString().slice(0,5)+' · '+(fbUser.email||''),'var(--green)'); pushSummary(); }
  catch(e){ ids.forEach(id=>pending.add(id)); console.error(e);
    if(e&&e.code==='permission-denied'){
      syncStatus('⛔ ไม่มีสิทธิ์บันทึก','#C00000');
      alertBar('⛔ <b>บันทึกไม่ได้ — บัญชีนี้ไม่มีสิทธิ์เขียนข้อมูลรอบตรวจนี้</b><br>'
        +'บัญชีที่ใช้อยู่: <b>'+((fbUser&&fbUser.email)||'-')+'</b> · รอบตรวจ: <b>'+AUDIT_ID+'</b><br>'
        +'สิ่งที่พิมพ์ไว้ยังอยู่ในเครื่องและยังไม่ถูกส่งขึ้นระบบ — แจ้งผู้ดูแลให้เพิ่มอีเมลนี้ใน Firestore Security Rules ก่อนปิดหน้านี้ '
        +'(กด 💾 บันทึกความคืบหน้า (JSON) ไว้ก่อนได้)','#FDECEC');
    } else syncStatus('⚠ บันทึกไม่สำเร็จ — จะลองใหม่','#C00000'); }
}
async function uploadPhoto(id, idx){
  try{
    const s=state[id]; const p=s.ph[idx]; if(!p||!p.d) return;
    const ref=FB.st.ref().child(`audits/${AUDIT_ID}/photos/${id}/${Date.now()}_${idx}.jpg`);
    await ref.putString(p.d,'data_url');
    p.u=await ref.getDownloadURL(); delete p.d;
    mark(id); refreshItem(id);
  }catch(e){ console.error('photo upload failed',e); }
}
(function(){          // ย่อหัวเมื่อเลื่อน — hysteresis + กัน loop ตอนอยู่ก้นหน้า
  let on=false, tick=false;
  const upd=()=>{
    tick=false;
    const y=scrollY, doc=document.documentElement;
    const nearBottom=(y+innerHeight)>=(doc.scrollHeight-12);
    const shortPage=doc.scrollHeight<=innerHeight+140;   // หน้าสั้น: หดแล้วจะเด้ง ไม่ต้องหด
    if(shortPage){ if(on){ on=false; document.body.classList.remove('shrunk'); } return; }
    if(nearBottom) return;                               // อยู่ก้นหน้า คงสถานะเดิม
    if(!on && y>110){ on=true; document.body.classList.add('shrunk'); }
    else if(on && y<45){ on=false; document.body.classList.remove('shrunk'); }
  };
  addEventListener('scroll',()=>{ if(!tick){ tick=true; requestAnimationFrame(upd); } },{passive:true});
})();
initFirebase();
</script>
